<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素背景</title>
    <style>
        /* 1. 清除网页默认边距，禁止滚动条 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* 2. 让画布铺满全屏，垫在所有内容最底层 */
        #bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            /* 关键：让像素块边缘锐利，不要模糊 */
            image-rendering: pixelated; 
        }

        /* 3. 你的网页正常内容样式 */
        .content {
            position: relative;
            z-index: 1;
            color: white;
            padding: 50px;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <!-- 你的网页正常内容 -->
    <div class="content">
        <h1>欢迎来到我的网站！</h1>
        <p>背景是纯代码画出来的像素日落哦~</p>
    </div>

    <!-- 4. 空画板，专门用来画背景 -->
    <canvas id="bg"></canvas>

    <!-- 5. 引入你刚才新建的 bg.js 文件 -->
    <script src="bg.js"></script>
</body>
</html>
